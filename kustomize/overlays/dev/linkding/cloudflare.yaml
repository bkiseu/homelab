apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2 # You could also consider elastic scaling for this deployment
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel

        # Points cloudflared to the config file, which configures what
        # cloudflared will actually do. This file is created by a ConfigMap
        # below.
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        # UDP/QUIC (port 7844) is blocked on this network, so cloudflared's
        # automatic protocol selection tries quic, times out across several
        # retries, then falls back to http2 - this build has no --protocol
        # flag to force http2 directly (checked `tunnel run --help`), so the
        # fallback dance has to be tolerated instead. startupProbe absorbs
        # that one-time delay; livenessProbe only takes over, with a much
        # tighter budget, once startup has actually succeeded.
        startupProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 12
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            # Cloudflared has a /ready endpoint which returns 200 if and only if
            # it has an active connection to the edge.
            path: /ready
            port: 2000
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        # Each tunnel has an associated "credentials file" which authorizes machines
        # to run the tunnel. cloudflared will read this file from its local filesystem,
        # and it'll be stored in a k8s secret.
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: tunnel-credentials

      # Create a config.yaml file from the ConfigMap below.
      - name: config
        configMap:
          name: cloudflared
          items:
          - key: config.yaml
            path: config.yaml
---
# This ConfigMap is just a way to define the cloudflared config.yaml file in k8s.
# It's useful to define it in k8s, rather than as a stand-alone .yaml file, because
# this lets you use various k8s templating solutions (e.g. Helm charts) to
# parameterize your config, instead of just using string literals.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    # Name of the tunnel you want to run
    
    tunnel: ldpi

    credentials-file: /etc/cloudflared/creds/credentials.json

    # Outbound UDP/QUIC (port 7844) is blocked on this network. cloudflared's
    # "auto" default still attempts quic first every time and only falls back
    # to http2 after repeated handshake timeouts (its own connectivity
    # pre-check correctly detects this and logs suggested_protocol=http2, but
    # doesn't actually act on it) - causing minutes-long reconnect storms that
    # outpace any reasonable liveness probe. Pinning http2 explicitly skips
    # the doomed quic attempts entirely.
    protocol: http2

    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
    - hostname: ldpi.sentinel-systems.net
      service: http://linkding:9090

    # Blog (dev-blog Application, kustomize/overlays/dev/blog) runs in its own
    # "blog" namespace, so it's addressed by cross-namespace Service DNS -
    # cloudflared itself still lives here, under the linkding overlay, since
    # this tunnel is shared across apps rather than one-per-app.
    - hostname: blog.bryantkiseu.com
      service: http://blog.blog.svc.cluster.local:80

    # This rule sends traffic to the built-in hello-world HTTP server. This can help debug connectivity
    # issues. If hello.example.com resolves and tunnel.example.com does not, then the problem is
    # in the connection from cloudflared to your local service, not from the internet to cloudflared.
    - hostname: hello.example.com
      service: hello_world
    # This rule matches any traffic which didn't match a previous rule, and responds with HTTP 404.
    - service: http_status:404
