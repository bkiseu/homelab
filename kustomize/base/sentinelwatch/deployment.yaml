apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelwatch
  template:
    metadata:
      labels:
        app: sentinelwatch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 20
      volumes:
      - name: site
        configMap:
          name: sentinelwatch-site
      - name: nginx-conf
        configMap:
          name: sentinelwatch-nginx
      - name: tmp
        emptyDir: {}
