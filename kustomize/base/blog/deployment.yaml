apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      # No registry/CI in this repo - the site is built fresh at pod startup
      # instead of baking a custom image. To publish a new post: push to
      # github.com/bkiseu/blog, then `kubectl rollout restart deployment/blog`
      # (or `task blog:publish`) to pick it up.
      initContainers:
      - name: fetch-content
        image: alpine/git:2.54.0
        # `git clone` refuses a non-empty destination. The emptyDir volume can
        # survive a pod sandbox recreation (e.g. after a brief node
        # NotReady blip) with the previous clone still in it, which would
        # otherwise crash-loop this container forever - so clear it first.
        command: ["sh", "-c"]
        args:
        - |
          rm -rf /src/..?* /src/.[!.]* /src/*
          git clone --recurse-submodules --depth=1 https://github.com/bkiseu/blog.git /src
        volumeMounts:
        - name: site-src
          mountPath: /src
      - name: build
        image: hugomods/hugo:0.156.0
        workingDir: /src
        command: ["hugo"]
        args: ["--minify", "-d", "/output"]
        volumeMounts:
        - name: site-src
          mountPath: /src
        - name: site-out
          mountPath: /output
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site-out
          mountPath: /usr/share/nginx/html
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
      volumes:
      - name: site-src
        emptyDir: {}
      - name: site-out
        emptyDir: {}
