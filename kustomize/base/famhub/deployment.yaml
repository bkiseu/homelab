apiVersion: apps/v1
kind: Deployment
metadata:
  name: famhub
  labels:
    app.kubernetes.io/name: famhub
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: famhub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: famhub
        app.kubernetes.io/component: app
    spec:
      # FamHub keeps its SQLite ledger and photos on node-local OpenEBS
      # rawfile-csi RWO PVCs (WaitForFirstConsumer), so this pod is pinned to
      # the same node the volumes bind to — same pattern as Immich.
      nodeSelector:
        kubernetes.io/hostname: watchtower
      containers:
        - name: famhub
          # Pinned by image digest-equivalent full commit sha, never a
          # floating :latest tag — see famhub/.github/workflows/docker.yml
          # (type=sha,format=long). Bump this line to roll the app forward.
          image: ghcr.io/bkiseu/famhub:89b0e26f2f70df98f05a2317e1cc4f6d1a7a5e64
          env:
            - name: TZ
              value: Africa/Nairobi
            # FamHub is reachable only via the tailnet (see ingress.yaml).
            # BIND_ADDR must stay 0.0.0.0 inside the pod — the Ingress/tailscale
            # proxy reaches the container here; the privacy boundary is the
            # tailscale Ingress, not a loopback bind.
            - name: BIND_ADDR
              value: "0.0.0.0"
            # Secrets are referenced by name only; values live in SOPS-encrypted
            # charts/famhub/dev-secrets.enc.yaml applied out-of-band via
            # `task secret:apply FILE=...`. ArgoCD has no SOPS plugin.
            # TODOIST / CALENDAR / MEALIE / MONARCH / VAPID env vars are set
            # here from the famhub-env Secret (key: value per env var), and
            # tokens never appear in git.
            - name: TODOIST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: famhub-env
                  key: TODOIST_TOKEN
                  optional: true
            - name: MEALIE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: famhub-env
                  key: MEALIE_TOKEN
                  optional: true
            - name: MONARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: famhub-env
                  key: MONARCH_PASSWORD
                  optional: true
            - name: MONARCH_TOTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: famhub-env
                  key: MONARCH_TOTP_SECRET
                  optional: true
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: famhub-env
                  key: VAPID_PUBLIC_KEY
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: famhub-env
                  key: VAPID_PRIVATE_KEY
                  optional: true
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: famhub-env
                  key: VAPID_SUBJECT
                  optional: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          # /db is the economy/journal SQLite ledger — the one truly
          # irreplaceable state; /data holds journal photos + nightly DB
          # backups (same split as the upstream docker-compose).
          volumeMounts:
            - name: famhub-db
              mountPath: /db
            - name: famhub-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 15
      volumes:
        - name: famhub-db
          persistentVolumeClaim:
            claimName: famhub-db-pvc
        - name: famhub-data
          persistentVolumeClaim:
            claimName: famhub-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: famhub
  labels:
    app.kubernetes.io/name: famhub
spec:
  selector:
    app.kubernetes.io/name: famhub
  ports:
    - port: 8080
      targetPort: 8080
---
# -----------------------------------------------------------------------------
# Storage — node-local OpenEBS rawfile-csi RWO PVCs, pinned to watchtower (the
# pod's nodeSelector), same as Immich. Two volumes because /db and /data have
# different lifecycles and backup needs:
#   famhub-db-pvc    — SQLite economy/journal ledger (single source of truth)
#   famhub-data-pvc  — journal photos + nightly DB backups
# The app runs its own nightly backup into /data (see server/), so both live
# on the watchtower NVMe. Off-box backup of /data (Nightly.sqlite.journal +
# photos) must be arranged separately — recommended: schedule a nightly
# `kubectl exec -- tar -C /data -czf - .` piped to off-cluster storage, or run
# restic against the OpenEBS volume. Not wired up yet — flagged for the CoS.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: famhub-db-pvc
  labels:
    app.kubernetes.io/name: famhub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: famhub-data-pvc
  labels:
    app.kubernetes.io/name: famhub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi