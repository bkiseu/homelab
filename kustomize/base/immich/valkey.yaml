apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  labels:
    app.kubernetes.io/name: immich-valkey
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-valkey
        app.kubernetes.io/component: cache
    spec:
      # Co-located with postgres/immich-server for locality - no PVC here
      # (job queue/cache only, no data worth persisting), so this isn't
      # strictly required, but keeps all three on one node for simplicity.
      nodeSelector:
        kubernetes.io/hostname: watchtower
      containers:
        - name: valkey
          # Pinned to the exact image+digest from Immich's own
          # docker-compose.yml (checked 2026-10-20, Immich v3.3.4).
          image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  labels:
    app.kubernetes.io/name: immich-valkey
spec:
  selector:
    app.kubernetes.io/name: immich-valkey
  ports:
    - port: 6379
      targetPort: 6379
