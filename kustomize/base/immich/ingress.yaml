# Tailnet-only exposure via the Tailscale Kubernetes Operator (see
# argocd/apps/dev/core.yaml for the operator's own Helm Application).
# Deliberately NOT routed through the shared Cloudflare tunnel - Immich must
# not be reachable from the public internet. ingressClassName: tailscale
# gets a MagicDNS name (immich.<tailnet>.ts.net) with an automatic
# Let's Encrypt cert from the operator, reachable only to devices on the
# tailnet. Both the Immich Android app users need Tailscale installed and
# logged into this tailnet - that's a manual step, not something this
# manifest can do.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - immich
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
