apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
        app.kubernetes.io/component: app
    spec:
      # Same node as postgres/valkey - keeps the library PVC (node-local
      # OpenEBS rawfile-csi) and the DB it's indexed against on one box.
      nodeSelector:
        kubernetes.io/hostname: watchtower
      containers:
        - name: immich-server
          # Pinned to v3.3.4 (current release as of 2026-10-20) rather than
          # the floating `release` tag the official compose file defaults to.
          # immich-machine-learning is intentionally not deployed here - Pi
          # CPU has no GPU/NPU path Immich supports (own FAQ flags Pi as too
          # heavy for ML), so Smart Search/Face Recognition need disabling in
          # Administration > Settings after first login or those jobs will
          # just retry against a machine-learning host that doesn't exist.
          image: ghcr.io/immich-app/immich-server:v3.3.4
          env:
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-secret
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: REDIS_PORT
              value: "6379"
          ports:
            - containerPort: 2283
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: library
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            periodSeconds: 10
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            periodSeconds: 15
      volumes:
        - name: library
          persistentVolumeClaim:
            # Deliberately a separate PVC from postgres's, per the "test now,
            # real library moves to dedicated storage later" plan - swapping
            # this one out later doesn't touch the database.
            claimName: immich-library-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/name: immich-server
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - port: 2283
      targetPort: 2283
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  labels:
    app.kubernetes.io/name: immich-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Test-scale only (watchtower's existing NVMe has ~870Gi free). The
      # real >1TB library moves to dedicated storage once that's decided -
      # this PVC is swappable independently of postgres's.
      storage: 150Gi
