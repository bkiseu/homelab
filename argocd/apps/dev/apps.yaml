# Dev Apps Layer - Applications deployed via Kustomize
# Contains: dev-apps project + linkding
#
# This file is consumed by the argocd-apps Helm chart via the dev ApplicationSet

# =============================================================================
# Project Definition
# =============================================================================
projects:
  dev-apps:
    namespace: argocd
    description: "Applications for dev environment"
    sourceRepos:
      - "https://github.com/bkiseu/homelab.git"
    destinations:
      - namespace: "*"
        server: https://kubernetes.default.svc
    # Allow namespace cluster-scoped resources creation
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

# =============================================================================
# Applications
# =============================================================================
applications:
  # ---------------------------------------------------------------------------
  # Blog - Hugo static site, built from github.com/bkiseu/blog at pod startup,
  # served via the shared ldpi cloudflared tunnel (see overlays/dev/linkding/cloudflare.yaml)
  # ---------------------------------------------------------------------------
  dev-blog:
    namespace: argocd
    project: dev-apps
    sources:
      - repoURL: https://github.com/bkiseu/homelab.git
        targetRevision: HEAD
        path: kustomize/overlays/dev/blog
    destination:
      server: https://kubernetes.default.svc
      namespace: blog
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
      retry:
        limit: 3
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

  # ---------------------------------------------------------------------------
  # Immich - self-hosted photo/video library (test deployment: ML disabled,
  # modest PVC on watchtower's existing NVMe, tailnet-only via the Tailscale
  # operator - see dev-core's dev-tailscale-operator). NOT routed through the
  # shared Cloudflare tunnel. immich-postgres-secret is applied out-of-band,
  # see kustomize/overlays/dev/immich/kustomization.yaml.
  # ---------------------------------------------------------------------------
  dev-immich:
    namespace: argocd
    project: dev-apps
    sources:
      - repoURL: https://github.com/bkiseu/homelab.git
        targetRevision: HEAD
        path: kustomize/overlays/dev/immich
    destination:
      server: https://kubernetes.default.svc
      namespace: immich
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
      retry:
        limit: 3
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

  # ---------------------------------------------------------------------------
  # Linkding - Self-hosted bookmark manager
  # ---------------------------------------------------------------------------
  dev-linkding:
    namespace: argocd
    project: dev-apps
    sources:
      - repoURL: https://github.com/bkiseu/homelab.git
        targetRevision: HEAD
        path: kustomize/overlays/dev/linkding
    destination:
      server: https://kubernetes.default.svc
      namespace: linkding
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
      retry:
        limit: 3
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m
